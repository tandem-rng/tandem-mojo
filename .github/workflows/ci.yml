name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: false
      - run: pixi run test
  vectors:
    name: vector data is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone --depth 1 https://github.com/tandem-rng/spec ../tandem-spec
          python3 tools/gen_vectors.py ../tandem-spec/vectors.json > tests/vectors_data.mojo
          git diff --exit-code tests/vectors_data.mojo
  derived:
    name: derived data and dumps are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone --depth 1 https://github.com/tandem-rng/tandem-c ../tandem-c
          python3 tools/gen_derived.py ../tandem-c/tests > tests/derived_data.mojo
          git diff --exit-code tests/derived_data.mojo
          diff -r ../tandem-c/tests/data tests/data
